[pytest]
# Корень проекта
pythonpath = .

# Каталог с тестами
testpaths = tests

# Шаблон имён тестовых файлов
python_files = test_*.py

# Шаблон имён тестовых функций
python_functions = test_*

# Настройки вывода
addopts = -ra --strict-markers

# Зарегистрированные маркеры
markers =
    config: Проверка конфигурации, LEVEL, сохранения и блокировок
    policy: Проверка температурной логики, PWM, TACH и start-boost
    calibration: Проверка калибровки baseline RPM
    runtime: Проверка мониторинга, CLI и работы daemon